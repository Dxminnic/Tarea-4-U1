<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixelVerse - Landing Page Gaming</title>
    
    <!-- 1. Bootstrap Icons via CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #f1f5f9;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            padding: 2rem;
            text-align: center;
            border-bottom: 1px solid #1e293b;
        }

        header h2 {
            font-size: 2rem;
            color: #a855f7;
        }

        .hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            text-align: center;
            padding: 3rem 1.5rem;
        }

        .hero h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
            color: #ec4899;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .hero p {
            font-size: 1.25rem;
            max-width: 650px;
            margin-bottom: 2.5rem;
            color: #94a3b8;
        }

        .card-container {
            display: flex;
            gap: 2rem;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 1rem;
        }

        .card {
            background: #181e2e;
            padding: 2rem 1.5rem;
            border-radius: 12px;
            width: 220px;
            text-align: center;
            border: 1px solid #2e374a;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.4);
            cursor: pointer;
        }

        .card i {
            font-size: 3rem;
            color: #38bdf8;
            margin-bottom: 1rem;
            display: inline-block;
        }

        .card h3 {
            font-size: 1.2rem;
            color: #f8fafc;
        }

        footer {
            background-color: #05070d;
            padding: 1.5rem;
            text-align: center;
            border-top: 1px solid #1e293b;
            margin-top: auto;
        }

        footer p {
            font-size: 0.95rem;
            color: #64748b;
        }
    </style>
</head>
<body>

    <header>
        <h2 class="title-anim"><i class="bi bi-controller"></i> PixelVerse Gaming</h2>
    </header>

    <main class="hero">
        <h1 class="hero-title">El Universo Gamer</h1>
        <p class="hero-desc">Explora los géneros más populares, compite en torneos épicos y vive la mejor experiencia de los videojuegos.</p>

        <div class="card-container">
            <div class="card">
                <i class="bi bi-trophy"></i>
                <h3>eSports</h3>
            </div>
            <div class="card">
                <i class="bi bi-headset"></i>
                <h3>Streaming</h3>
            </div>
            <div class="card">
                <i class="bi bi-dpad"></i>
                <h3>Consolas</h3>
            </div>
        </div>
    </main>

    <!-- 5. Autoría con Nombre Completo y No. Control -->
    <footer>
        <p><strong>Desarrollado por:</strong> Villavicencio Barron Evan Dominic | <strong>No. Control:</strong> 221130303</p>
    </footer>

    <!-- 2. GSAP via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    
    <!-- Animaciones GSAP -->
    <script>
        // Animaciones de entrada al cargar
        gsap.from(".title-anim", { duration: 1, y: -50, opacity: 0, ease: "bounce" });
        gsap.from(".hero-title", { duration: 1.2, delay: 0.3, opacity: 0, y: 30 });
        gsap.from(".hero-desc", { duration: 1.2, delay: 0.6, opacity: 0, y: 30 });
        gsap.from(".card", { duration: 1, delay: 0.9, opacity: 0, scale: 0.5, stagger: 0.2 });

        // Efecto hover interactivo con GSAP en las tarjetas
        document.querySelectorAll('.card').forEach(card => {
            card.addEventListener('mouseenter', () => {
                gsap.to(card, { scale: 1.08, duration: 0.3, borderColor: "#ec4899" });
            });
            card.addEventListener('mouseleave', () => {
                gsap.to(card, { scale: 1, duration: 0.3, borderColor: "#2e374a" });
            });
        });
    </script>
</body>
</html>
